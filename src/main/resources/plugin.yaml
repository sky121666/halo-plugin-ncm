apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: plugin-ncm
spec:
  enabled: true
  requires: ">=2.27.0"
  pluginDependencies:
    ai-foundation?: ">=1.4.0 & <2.0.0"
  author:
    name: sky
  settingName: plugin-ncm-settings
  configMapName: plugin-ncm-configmap
