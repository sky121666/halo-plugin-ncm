import groovy.json.JsonSlurper

plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'cn.sky.ncm.ui'

node {
    pnpmVersion.set(providers.fileContents(layout.projectDirectory.file('package.json')).asText.map { manifest ->
        new JsonSlurper().parseText(manifest).packageManager.substring('pnpm@'.length())
    })
}

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    description = 'Build the UI project using pnpm'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.file(rootProject.layout.projectDirectory.file('frontstage/mini-player/placement.ts'))
    inputs.files(fileTree(
        dir: layout.projectDirectory,
        includes: ['*.cjs', '*.ts', '*.js', '*.json', '*.yaml']))
    outputs.dir(layout.buildDirectory.dir('dist'))
    // 前端依赖 generateApiClient 生成的代码，缺失时给出明确提示
    def generatedIndex = layout.projectDirectory.file('src/api/generated/index.ts').asFile
    doFirst {
        if (!generatedIndex.exists()) {
            throw new GradleException('缺少 ui/src/api/generated。请先在插件根目录执行 ./gradlew generateApiClient（需要 Docker），再重新构建。')
        }
    }
}

tasks.register('pnpmCheck', PnpmTask) {
    group = 'verification'
    description = 'Run unit tests for the UI project using pnpm'
    args = ['test:unit']
    dependsOn tasks.named('pnpmInstall')
}

tasks.register('buildMiniPlayer', PnpmTask) {
    group = 'build'
    description = 'Compile the theme-independent mini player'
    dependsOn tasks.named('pnpmInstall')
    def source = rootProject.layout.projectDirectory.dir('frontstage/mini-player')
    def destination = layout.buildDirectory.dir('mini-player')
    inputs.dir(source)
    outputs.dir(destination)
    args = ['exec', 'tsc', '--project', source.file('tsconfig.json').asFile.absolutePath,
        '--outDir', destination.get().asFile.absolutePath]
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}
